# ======================================================================
# cifras_manuscrito.yaml
# ----------------------------------------------------------------------
# Cada entrada declara UNA cifra citada en el manuscrito y cómo
# recalcularla desde los CSV que este repositorio entrega. El verificador
# (verify/verificar_cifras.py) recorre el archivo y emite PASA / FALLA.
#
# Campos:
#   id             identificador estable de la cifra
#   tabla          tabla, figura o sección del manuscrito donde aparece
#   valor          el número TAL COMO SE IMPRIME en el .tex
#   fuente         CSV, relativo a la raíz del repositorio
#   columna        columna del CSV
#   filtro         {col: valor} para elegir la(s) fila(s)
#   reduccion      first | last | mean | median | min | max | sum | count | std
#   transformacion periodo | inverso | exp | log | sqrt | negativo   (opcional)
#   escala         multiplicador aplicado después (opcional)
#   redondeo       decimales; con este campo la comparación es dígito a
#                  dígito contra el valor impreso
#   tolerancia     alternativa a `redondeo`: tolerancia RELATIVA
#   estado         `pendiente` marca cifras cuya fuente todavía no está
#                  en el repositorio; se informan como omitidas
#
# Cobertura al día de hoy: el bloque de destilación paramétrica (v5.1)
# está completo y verificado. Los demás bloques quedan declarados como
# pendientes hasta que se incorporen los CSV correspondientes; ver
# docs/PENDIENTES.md.
# ======================================================================


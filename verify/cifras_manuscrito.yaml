# ── Experimento 4 · ruido observacional ────────────────────────────────────
#
# ATENCIÓN. De este experimento se declara UNA sola cifra, y no por falta de
# datos: los datos están completos. Es que `tab:noise_beta` NO SE REPRODUCE
# desde ellos, y conviene que el verificador lo diga en vez de callarlo.
#
# Lo comprobado el 2026-10-18 contra results/final_suite_ruido/, que son dos
# archivos independientes que coinciden entre sí (los siete por escenario y
# el unificado):
#
#   · Los niveles de ruido del dato son sigma_rel ∈ {0.0, 0.05, 0.10, 0.20}.
#     La tabla encabeza la columna «sigma_obs/N» con {0.01, 0.05, 0.10}. El
#     0.01 no existe en los datos y el 0.20 no está en la tabla.
#
#   · De los 30 valores de media que imprime la tabla, uno solo aparece en
#     los datos (0.049), y en otro escenario, otro sigma y otro método que
#     los que la tabla le asigna. Busqué los seis números de la fila Linear
#     en las seis columnas numéricas × cuatro sigmas × dos métodos: cero
#     coincidencias.
#
#   · El texto dice que tras Benjamini-Hochberg «six remain significant
#     under both tests». Con estos datos sobreviven 16, y nominalmente
#     significativas bajo ambas pruebas son 17, no 10.
#
#   · El ejemplo del texto —«in the Linear scenario mean RMSE_beta increases
#     from 0.196 under global training to 0.449 with m=10»— va en sentido
#     contrario al dato: en el nivel de ruido más bajo que existe (0.05),
#     Linear va de 0.178 con UDE a 0.100 con SW-UDE, o sea que SW-UDE es
#     MEJOR. La reversión en Linear empieza en 0.10, no en el nivel más bajo.
#
# La lectura más consistente es que §4.1.3 viene de una corrida anterior, con
# niveles {0.01, 0.05, 0.10}, y que el experimento se volvió a correr con
# {0.05, 0.10, 0.20} sin actualizar el manuscrito. Dos indicios lo apoyan: el
# dato es MÁS favorable a la tesis del artículo que lo que el artículo
# reporta (16 sobreviven contra 6), lo que descarta que se haya exagerado; y
# la única afirmación que reproduce exacta es la de recuento, que da 18 de 21
# en las dos versiones.
#
# Hasta que se resuelva, lo honesto es declarar solo esa afirmación. Ver
# docs/PENDIENTES.md §4.1.

- id: ruido_recuento.ventanas_peor_que_global
  tabla: "sec:noise_results"
  valor: 18
  fuente: results/final_suite_ruido/comparacion_pareada_ruido_TODOS_escenarios.csv
  columna: media_Windowed
  columna_vs: media_UDE
  filtro: {m: 10}
  filtro_no: {sigma_ruido: 0.0}
  reduccion: count_pos
  redondeo: 0
  nota: >-
    «mean RMSE_beta is higher for windowed training than for global training
    in 18 of the 21 scenario-noise combinations». Cuenta las filas con
    media_Windowed > media_UDE entre las 21 con ruido, es decir excluyendo
    sigma = 0. Es la única cifra de §4.1.3 que reproduce desde los datos
    entregados.

